[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicscraper"
version = "1.0.0"
description = "A complete music collection, archival, metadata tagging, and discography download suite"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
    "musicbrainzngs>=0.7.1",
    "mutagen>=1.47.0",
    "unidecode>=1.3.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
musicscraper = "musicscraper.cli.main:main"
ms = "musicscraper.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
